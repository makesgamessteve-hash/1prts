# 1stPRTS continuous integration. See docs/architecture/quality-and-build.md.
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  OPENSPEC_TELEMETRY: "0"

jobs:
  linux-coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build, display and coverage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxss-dev libxfixes-dev libxtst-dev libxkbcommon-dev libegl-dev libgl-dev libgles-dev \
            libasound2-dev libpulse-dev libdrm-dev libgbm-dev xvfb libgl1-mesa-dri
          pip install gcovr
      - name: Configure and build (coverage)
        run: |
          cmake --preset coverage
          cmake --build --preset coverage
      - name: Unit, Lua, scenario and rendered tests (Xvfb + Mesa llvmpipe)
        run: xvfb-run -a -s "-screen 0 1280x720x24" ctest --preset coverage
      - name: C coverage gate (>= 95% lines)
        run: gcovr --root . --filter 'engine/src/' --object-directory build/coverage --fail-under-line 95 --txt
      - name: Lua coverage gate (>= 95% lines)
        run: python3 -I tools/coverage/lua_gate.py build/coverage/lua-coverage --min 95
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-linux
          path: build/coverage/screenshots/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: golden-differences
          path: |
            build/coverage/golden-out/
            build/coverage/golden-diff/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-linux
          path: build/coverage/junit/

  linux-sanitize:
    runs-on: ubuntu-24.04
    env:
      ASAN_OPTIONS: detect_leaks=0
    steps:
      - uses: actions/checkout@v4
      - name: Install build and display tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxss-dev libxfixes-dev libxtst-dev libxkbcommon-dev libegl-dev libgl-dev libgles-dev \
            libasound2-dev libpulse-dev xvfb libgl1-mesa-dri
      - run: cmake --preset sanitize && cmake --build --preset sanitize
      - run: xvfb-run -a -s "-screen 0 1280x720x24" ctest --preset sanitize

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - run: cmake --preset release -DCMAKE_C_COMPILER=cl
      - run: cmake --build --preset release
      - name: Headless tests (Lua and scenarios)
        run: ctest --test-dir build/release -LE gl -E prts_unit_tests --output-on-failure
      - run: build/release/bin/prts_tests.exe

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: brew install ninja
      - run: cmake --preset release && cmake --build --preset release
      - name: Unit, Lua and scenario tests (headless)
        run: ctest --test-dir build/release -LE gl --output-on-failure

  web:
    runs-on: ubuntu-24.04
    env:
      EMSDK_VERSION: "7.0.0" # pinned; the version the web build was verified with
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Emscripten and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"
      - name: Build web-release with browser test hooks
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          cmake --preset web-release -DPRTS_WEB_TEST_HOOKS=ON
          cmake --build --preset web-release
      - name: Install Playwright and Chromium
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser end-to-end tests (desktop, mobile emulation, no WebGL 2, IndexedDB, XR mock)
        run: node web/tests/run.js
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-test-screenshots
          path: build/web-tests/

  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: OpenSpec
        run: npx openspec validate --all --strict
      - name: Engine layering rules
        run: python3 -I tools/check_layering.py
      - name: Asset credits, references, formats and manifests
        run: python3 -I tools/validate_assets.py
      - name: Scripting API documentation (every prts.* function in docs/modding/api-m1.md)
        run: python3 -I tools/check_api_docs.py
      - name: Spec scenarios linked to tests (tests/README.md)
        run: python3 -I tools/check_spec_coverage.py
      - name: Self-tests of the checks
        run: |
          python3 -I tools/tests/test_validate_assets.py
          python3 -I tools/tests/test_check_scripts.py
